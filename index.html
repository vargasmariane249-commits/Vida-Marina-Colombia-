<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vida Marina Colombiana - ¡Aventura en el Caribe y el Pacífico!</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Fredoka & Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        fredoka: ['Fredoka', 'sans-serif'],
                        inter: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        oceanTurquoise: '#06b6d4',
                        oceanBlue: '#0284c7',
                        coralPink: '#fb7185',
                        sunYellow: '#facc15',
                        seaGreen: '#34d399',
                        deepNavy: '#0f172a',
                        coralOrange: '#fb923c'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0284c7 0%, #06b6d4 50%, #34d399 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }
        h1, h2, h3, .font-title {
            font-family: 'Fredoka', sans-serif;
        }
        /* Floating bubbles animation */
        @keyframes floatBubble {
            0% { transform: translateY(0px) scale(1); opacity: 0.8; }
            50% { transform: translateY(-100px) scale(1.1); opacity: 0.4; }
            100% { transform: translateY(-200px) scale(0.9); opacity: 0; }
        }
        .bubble {
            position: absolute;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            pointer-events: none;
            animation: floatBubble 4s infinite ease-in-out;
        }
        /* Fish swimming animation */
        @keyframes swim {
            0% { transform: translateX(-100px) scaleX(1); }
            49% { transform: translateX(calc(100vw + 100px)) scaleX(1); }
            50% { transform: translateX(calc(100vw + 100px)) scaleX(-1); }
            99% { transform: translateX(-100px) scaleX(-1); }
            100% { transform: translateX(-100px) scaleX(1); }
        }
        .swimming-fish {
            position: absolute;
            animation: swim 25s infinite linear;
            pointer-events: none;
            z-index: 1;
        }
        /* Pulse glow */
        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); box-shadow: 0 0 15px rgba(250, 204, 21, 0.6); }
            50% { transform: scale(1.05); box-shadow: 0 0 25px rgba(250, 204, 21, 0.9); }
        }
        .pulse-glow {
            animation: pulseGlow 2s infinite;
        }
    </style>
</head>
<body class="text-slate-800 relative selection:bg-sunYellow selection:text-deepNavy">

    <!-- Background Bubbles & Swimming Fish Container -->
    <div id="bg-effects" class="fixed inset-0 pointer-events-none overflow-hidden z-0">
        <div class="swimming-fish text-4xl top-20" style="animation-duration: 22s;">🐠</div>
        <div class="swimming-fish text-3xl top-1/3" style="animation-duration: 30s; animation-delay: 5s;">🐢</div>
        <div class="swimming-fish text-4xl top-2/3" style="animation-duration: 26s; animation-delay: 2s;">🐬</div>
        <div class="swimming-fish text-3xl top-1/4" style="animation-duration: 35s; animation-delay: 10s;">🐡</div>
    </div>

    <!-- Main App Container -->
    <div id="app" class="relative z-10 max-w-6xl mx-auto px-4 py-6 flex flex-col min-h-screen">

        <!-- Header Navbar -->
        <header class="bg-white/85 backdrop-blur-md rounded-3xl shadow-xl p-4 mb-6 flex flex-wrap items-center justify-between border-4 border-oceanTurquoise">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="showScreen('home')">
                <span class="text-4xl animate-bounce">🌊</span>
                <div>
                    <h1 class="text-2xl font-bold text-oceanBlue tracking-wide">Vida Marina Colombiana</h1>
                    <p class="text-xs text-slate-600 font-semibold">¡Aventura en el Caribe y el Pacífico!</p>
                </div>
            </div>

            <div class="flex items-center space-x-2 sm:space-x-4 mt-3 sm:mt-0">
                <div class="bg-sunYellow/30 border-2 border-sunYellow px-3 py-1.5 rounded-full flex items-center space-x-2 shadow-inner">
                    <span class="text-xl">⭐</span>
                    <span id="score-counter" class="font-bold text-deepNavy">0 Pts</span>
                </div>
                <div class="bg-coralPink/30 border-2 border-coralPink px-3 py-1.5 rounded-full flex items-center space-x-2 shadow-inner">
                    <span class="text-xl">🏅</span>
                    <span id="badges-counter" class="font-bold text-deepNavy">0/5 Medallas</span>
                </div>
                <button onclick="showScreen('home')" class="bg-oceanBlue hover:bg-oceanTurquoise text-white font-bold px-4 py-2 rounded-2xl shadow-md transition transform hover:scale-105 active:scale-95 text-sm">
                    🏠 Menú
                </button>
            </div>
        </header>

        <!-- Dynamic Content Screen Area -->
        <main id="main-content" class="flex-grow flex flex-col justify-center items-center pb-8">
            <!-- Content will be dynamically injected here -->
        </main>

        <!-- Footer -->
        <footer class="text-center text-white/90 text-sm py-4 font-medium bg-white/10 rounded-2xl backdrop-blur-sm mt-4 border border-white/20">
            🐟 Hecho con amor para los exploradores del océano de Colombia • Caribe & Pacífico 🐋
        </footer>

    </div>

    <!-- Notification Toast Modal -->
    <div id="toast-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-8 max-w-md w-full text-center shadow-2xl border-4 border-sunYellow transform scale-95 transition-all duration-300" id="toast-box">
            <div id="toast-icon" class="text-6xl mb-3">🎉</div>
            <h3 id="toast-title" class="text-2xl font-bold text-oceanBlue mb-2">¡Excelente Trabajo!</h3>
            <p id="toast-msg" class="text-slate-600 mb-6 font-medium">Has ganado 50 puntos y una nueva insignia.</p>
            <button onclick="closeToast()" class="bg-gradient-to-r from-oceanTurquoise to-oceanBlue text-white font-bold px-8 py-3 rounded-2xl shadow-lg hover:opacity-90 transition transform hover:scale-105">
                ¡Continuar Aventura! 🚀
            </button>
        </div>
    </div>

    <!-- JavaScript Game Engine & Logic -->
    <script>
        // Global State
        let gameState = {
            score: parseInt(localStorage.getItem('vmc_score')) || 0,
            badges: JSON.parse(localStorage.getItem('vmc_badges')) || [false, false, false, false, false],
            completedGames: JSON.parse(localStorage.getItem('vmc_completed')) || [false, false, false, false, false]
        };

        function saveGameState() {
            localStorage.setItem('vmc_score', gameState.score);
            localStorage.setItem('vmc_badges', JSON.stringify(gameState.badges));
            localStorage.setItem('vmc_completed', JSON.stringify(gameState.completedGames));
            updateCounters();
        }

        function updateCounters() {
            document.getElementById('score-counter').innerText = `${gameState.score} Pts`;
            const earnedBadges = gameState.badges.filter(b => b).length;
            document.getElementById('badges-counter').innerText = `${earnedBadges}/5 Medallas`;
        }

        // Initialize background bubbles
        function initBubbles() {
            const container = document.getElementById('bg-effects');
            for(let i=0; i<15; i++) {
                const bubble = document.createElement('div');
                bubble.classList.add('bubble');
                const size = Math.random() * 20 + 10;
                bubble.style.width = `${size}px`;
                bubble.style.height = `${size}px`;
                bubble.style.left = `${Math.random() * 100}%`;
                bubble.style.bottom = `-50px`;
                bubble.style.animationDuration = `${Math.random() * 4 + 3}s`;
                bubble.style.animationDelay = `${Math.random() * 5}s`;
                container.appendChild(bubble);
            }
        }

        // Screen Router
        function showScreen(screenId, param = null) {
            const main = document.getElementById('main-content');
            window.scrollTo({ top: 0, behavior: 'smooth' });

            switch(screenId) {
                case 'home':
                    main.innerHTML = renderHomeScreen();
                    break;
                case 'story':
                    main.innerHTML = renderStoryScreen();
                    break;
                case 'map':
                    main.innerHTML = renderMapScreen();
                    break;
                case 'coloring':
                    main.innerHTML = renderColoringScreen();
                    break;
                case 'minigame':
                    main.innerHTML = renderMiniGameContainer(param);
                    initMiniGame(param);
                    break;
                default:
                    main.innerHTML = renderHomeScreen();
            }
            updateCounters();
        }

        // 1. Home Screen
        function renderHomeScreen() {
            return `
                <div class="text-center max-w-4xl mx-auto bg-white/90 backdrop-blur-md rounded-3xl p-8 sm:p-12 shadow-2xl border-4 border-oceanBlue">
                    <div class="inline-block bg-sunYellow text-deepNavy px-6 py-2 rounded-full font-bold text-sm mb-4 shadow-sm animate-pulse">
                        ✨ ¡Descubre el Caribe y el Pacífico de Colombia! ✨
                    </div>
                    <h2 class="text-4xl sm:text-6xl font-bold text-oceanBlue mb-4 drop-shadow-sm">
                        ¡Bienvenido, Guardián del Mar! 🌊
                    </h2>
                    <p class="text-slate-600 text-lg sm:text-xl mb-8 max-w-2xl mx-auto font-medium">
                        Embárcate en una travesía mágica para proteger los arrecifes coralinos, los manglares, las tortugas marinas y las ballenas jorobadas de nuestras hermosas costas colombianas.
                    </p>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                        <button onclick="showScreen('story')" class="bg-gradient-to-br from-coralPink to-coralOrange text-white font-bold p-6 rounded-3xl shadow-lg hover:shadow-xl transition transform hover:-translate-y-1 flex flex-col items-center group">
                            <span class="text-4xl mb-2 group-hover:scale-125 transition">📖</span>
                            <span class="text-lg">Historia Mágica</span>
                        </button>
                        <button onclick="showScreen('map')" class="bg-gradient-to-br from-oceanTurquoise to-oceanBlue text-white font-bold p-6 rounded-3xl shadow-lg hover:shadow-xl transition transform hover:-translate-y-1 flex flex-col items-center group">
                            <span class="text-4xl mb-2 group-hover:scale-125 transition">🗺️</span>
                            <span class="text-lg">Misiones y Juegos</span>
                        </button>
                        <button onclick="showScreen('coloring')" class="bg-gradient-to-br from-sunYellow to-amber-500 text-deepNavy font-bold p-6 rounded-3xl shadow-lg hover:shadow-xl transition transform hover:-translate-y-1 flex flex-col items-center group">
                            <span class="text-4xl mb-2 group-hover:scale-125 transition">🎨</span>
                            <span class="text-lg">Arte y Colores</span>
                        </button>
                        <button onclick="showBadgesModal()" class="bg-gradient-to-br from-seaGreen to-emerald-600 text-white font-bold p-6 rounded-3xl shadow-lg hover:shadow-xl transition transform hover:-translate-y-1 flex flex-col items-center group">
                            <span class="text-4xl mb-2 group-hover:scale-125 transition">🏆</span>
                            <span class="text-lg">Mis Medallas</span>
                        </button>
                    </div>

                    <button onclick="showScreen('map')" class="bg-gradient-to-r from-coralPink via-sunYellow to-seaGreen text-deepNavy font-extrabold text-xl px-10 py-4 rounded-full shadow-2xl hover:opacity-90 transition transform hover:scale-105 pulse-glow">
                        🚀 ¡Jugar Ahora!
                    </button>
                </div>
            `;
        }

        // 2. Story Intro Screen
        function renderStoryScreen() {
            return `
                <div class="max-w-3xl mx-auto bg-white/95 backdrop-blur-md rounded-3xl p-8 sm:p-10 shadow-2xl border-4 border-coralPink">
                    <div class="text-center mb-6">
                        <span class="text-5xl">🐢🐋🐬</span>
                        <h2 class="text-3xl sm:text-4xl font-bold text-oceanBlue mt-2">El Llamado del Océano</h2>
                        <p class="text-slate-500 text-sm">Una aventura entre el Mar Caribe y el Océano Pacífico</p>
                    </div>

                    <div class="space-y-4 text-slate-700 text-base sm:text-lg leading-relaxed mb-8 bg-sky-50 p-6 rounded-2xl border-2 border-sky-200">
                        <p>
                            En las hermosas aguas cristalinas del <strong>Caribe colombiano</strong> (con sus coloridos arrecifes en San Andrés y Providencia) y en las cálidas y profundas olas del <strong>Pacífico colombiano</strong> (donde llegan las majestuosas ballenas jorobadas), la vida marina está cantando una melodía de ayuda.
                        </p>
                        <p>
                            El plástico arrastrado por las corrientes y el desorden en los manglares están poniendo en peligro a nuestras amigas las tortugas carey, los peces coloridos y los cangrejos sabios.
                        </p>
                        <p class="font-bold text-oceanBlue">
                            ¡Tú has sido elegido como el nuevo Guardián del Mar! Completa las 5 misiones submarinas para limpiar el océano, proteger la biodiversidad y ganar todas las medallas de honor.
                        </p>
                    </div>

                    <div class="flex justify-between items-center">
                        <button onclick="showScreen('home')" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-6 py-3 rounded-2xl transition">
                            ⬅️ Volver
                        </button>
                        <button onclick="showScreen('map')" class="bg-oceanBlue hover:bg-oceanTurquoise text-white font-bold px-8 py-3 rounded-2xl shadow-lg transition transform hover:scale-105">
                            🗺️ Ir al Mapa de Misiones 🌟
                        </button>
                    </div>
                </div>
            `;
        }

        // 3. Map / Missions Screen
        function renderMapScreen() {
            const games = [
                { id: 1, title: "1. Rescate en el Arrecife", desc: "Ayuda a la tortuga carey a esquivar plásticos y recolectar corales.", icon: "🐢", color: "from-cyan-400 to-blue-500" },
                { id: 2, title: "2. Concierto de Ballenas", desc: "Memoriza y repite los hermosos cantos de las ballenas jorobadas.", icon: "🐋", color: "from-blue-500 to-indigo-600" },
                { id: 3, title: "3. Guardianes del Manglar", desc: "Clasifica correctamente a los animales en su hábitat natural.", icon: "🌳", color: "from-emerald-400 to-green-600" },
                { id: 4, title: "4. Trivia Marina", desc: "Demuestra lo que sabes sobre la fauna y flora de Colombia.", icon: "❓", color: "from-amber-400 to-orange-500" },
                { id: 5, title: "5. Limpieza del Fondo", desc: "Elimina la basura y descubre tesoros marinos ocultos.", icon: "✨", color: "from-pink-400 to-rose-500" }
            ];

            let gamesHtml = games.map((g, idx) => `
                <div onclick="showScreen('minigame', ${g.id})" class="bg-white/90 backdrop-blur-md rounded-3xl p-6 shadow-xl border-4 border-white hover:border-sunYellow transition transform hover:-translate-y-2 cursor-pointer flex flex-col justify-between relative overflow-hidden group">
                    <div class="absolute -right-6 -bottom-6 text-8xl opacity-10 group-hover:opacity-20 transition">${g.icon}</div>
                    <div>
                        <div class="w-16 h-16 rounded-2xl bg-gradient-to-br ${g.color} text-white flex items-center justify-center text-3xl mb-4 shadow-md">
                            ${g.icon}
                        </div>
                        <h3 class="text-xl font-bold text-oceanBlue mb-2">${g.title}</h3>
                        <p class="text-slate-600 text-sm mb-4 font-medium">${g.desc}</p>
                    </div>
                    <div class="flex items-center justify-between mt-2">
                        <span class="text-xs font-bold px-3 py-1 rounded-full ${gameState.completedGames[idx] ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700'}">
                            ${gameState.completedGames[idx] ? '✅ ¡Completado!' : '⭐ ¡Jugar Ahora!'}
                        </span>
                        <span class="text-oceanBlue font-bold text-sm group-hover:translate-x-1 transition">Entrar ➡️</span>
                    </div>
                </div>
            `).join('');

            return `
                <div class="max-w-5xl mx-auto w-full">
                    <div class="text-center mb-8 bg-white/80 backdrop-blur-md p-6 rounded-3xl shadow-lg border-2 border-white">
                        <h2 class="text-3xl sm:text-4xl font-bold text-oceanBlue mb-2">🗺️ Mapa de Misiones Submarinas</h2>
                        <p class="text-slate-600 font-medium">Selecciona una misión para aprender, jugar y ganar medallas en el Caribe y el Pacífico.</p>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
                        ${gamesHtml}
                    </div>
                </div>
            `;
        }

        // 4. Mini-Game Container & Router
        function renderMiniGameContainer(gameId) {
            return `
                <div class="max-w-3xl mx-auto w-full bg-white/95 backdrop-blur-md rounded-3xl p-6 sm:p-8 shadow-2xl border-4 border-oceanTurquoise">
                    <div class="flex justify-between items-center mb-6 pb-4 border-b-2 border-slate-100">
                        <button onclick="showScreen('map')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold px-4 py-2 rounded-xl text-sm transition">
                            ⬅️ Volver al Mapa
                        </button>
                        <h2 id="mg-title" class="text-xl sm:text-2xl font-bold text-oceanBlue text-center">Minijuego</h2>
                        <span id="mg-badge-status" class="text-2xl">🌟</span>
                    </div>
                    <div id="mg-content">
                        <!-- Mini game specific UI loaded dynamically -->
                    </div>
                </div>
            `;
        }

        function initMiniGame(gameId) {
            switch(gameId) {
                case 1: initMiniGame1(); break;
                case 2: initMiniGame2(); break;
                case 3: initMiniGame3(); break;
                case 4: initMiniGame4(); break;
                case 5: initMiniGame5(); break;
            }
        }

        // --- MINIGAME 1: Rescate en el Arrecife (Tortuga y Plásticos) ---
        let mg1Interval = null;
        function initMiniGame1() {
            document.getElementById('mg-title').innerText = "🐢 Rescate en el Arrecife";
            document.getElementById('mg-content').innerHTML = `
                <div class="text-center">
                    <p class="text-slate-600 mb-4 font-medium">Ayuda a la tortuga carey a esquivar plásticos (❌) y recolectar corales sanos (💚). ¡Usa las flechas o toca los botones!</p>
                    <div class="relative bg-slate-900 rounded-2xl overflow-hidden h-72 mx-auto max-w-md border-4 border-oceanBlue shadow-inner flex items-center justify-center" id="mg1-arena">
                        <div id="mg1-turtle" class="absolute bottom-4 left-1/2 -translate-x-1/2 text-4xl transition-all duration-100">🐢</div>
                        <div id="mg1-item" class="absolute top-0 text-3xl transition-all duration-100" style="left: 50%;">❌</div>
                        <div id="mg1-overlay" class="absolute inset-0 bg-black/70 flex flex-col items-center justify-center p-6 text-white">
                            <h3 class="text-2xl font-bold mb-2">¡Protege a la Tortuga Carey!</h3>
                            <p class="text-sm text-center mb-4">Evita el plástico y atrapa los corales sanos.</p>
                            <button onclick="startMg1()" class="bg-sunYellow text-deepNavy font-bold px-6 py-3 rounded-xl shadow-lg hover:scale-105 transition">Comenzar Aventura 🚀</button>
                        </div>
                    </div>
                    <div class="flex justify-center space-x-6 mt-6">
                        <button onclick="moveMg1(-1)" class="bg-oceanBlue hover:bg-oceanTurquoise text-white font-bold text-2xl w-16 h-16 rounded-2xl shadow-lg active:scale-95">⬅️</button>
                        <button onclick="moveMg1(1)" class="bg-oceanBlue hover:bg-oceanTurquoise text-white font-bold text-2xl w-16 h-16 rounded-2xl shadow-lg active:scale-95">➡️</button>
                    </div>
                </div>
            `;
        }

        let mg1Pos = 50; // percentage
        let mg1Score = 0;
        let mg1GameActive = false;
        let mg1ItemX = 50;
        let mg1ItemY = 0;
        let mg1ItemType = '❌';

        function startMg1() {
            document.getElementById('mg1-overlay').classList.add('hidden');
            mg1Score = 0;
            mg1Pos = 50;
            mg1GameActive = true;
            spawnMg1Item();
            mg1Interval = setInterval(updateMg1, 30);
        }

        function spawnMg1Item() {
            mg1ItemX = Math.random() * 80 + 10;
            mg1ItemY = 0;
            mg1ItemType = Math.random() > 0.4 ? '❌' : '💚';
            const itemEl = document.getElementById('mg1-item');
            if(itemEl) itemEl.innerText = mg1ItemType;
        }

        function moveMg1(dir) {
            if(!mg1GameActive) return;
            mg1Pos += dir * 15;
            if(mg1Pos < 5) mg1Pos = 5;
            if(mg1Pos > 90) mg1Pos = 90;
            const turtle = document.getElementById('mg1-turtle');
            if(turtle) turtle.style.left = `${mg1Pos}%`;
        }

        function updateMg1() {
            if(!mg1GameActive) return;
            mg1ItemY += 3;
            const itemEl = document.getElementById('mg1-item');
            if(itemEl) {
                itemEl.style.top = `${mg1ItemY}%`;
                itemEl.style.left = `${mg1ItemX}%`;
            }

            // Check collision around Y = 75%
            if(mg1ItemY >= 70 && mg1ItemY <= 85) {
                // Check X proximity
                if(Math.abs(mg1Pos - mg1ItemX) < 15) {
                    if(mg1ItemType === '❌') {
                        // Hit plastic!
                        endMg1(false);
                    } else {
                        // Collected coral!
                        mg1Score += 25;
                        if(mg1Score >= 100) {
                            endMg1(true);
                        } else {
                            spawnMg1Item();
                        }
                    }
                }
            }

            if(mg1ItemY > 95) {
                spawnMg1Item();
            }
        }

        function endMg1(success) {
            mg1GameActive = false;
            clearInterval(mg1Interval);
            if(success) {
                triggerReward(1, "¡Biólogo Junior del Caribe!", 100);
            } else {
                document.getElementById('mg1-overlay').innerHTML = `
                    <h3 class="text-2xl font-bold mb-2 text-coralPink">¡Oh no! Tuviste contacto con plástico</h3>
                    <p class="text-sm mb-4">El plástico contamina los océanos de Colombia. ¡Inténtalo de nuevo!</p>
                    <button onclick="initMiniGame1()" class="bg-sunYellow text-deepNavy font-bold px-6 py-3 rounded-xl shadow-lg">Intentar de Nuevo 🔄</button>
                `;
                document.getElementById('mg1-overlay').classList.remove('hidden');
            }
        }


        // --- MINIGAME 2: Concierto de las Ballenas Jorobadas (Memoria/Ritmo) ---
        let mg2Sequence = [];
        let mg2PlayerSeq = [];
        let mg2Step = 0;
        let mg2Active = false;

        function initMiniGame2() {
            document.getElementById('mg-title').innerText = "🐋 El Concierto de las Ballenas";
            document.getElementById('mg-content').innerHTML = `
                <div class="text-center">
                    <p class="text-slate-600 mb-6 font-medium">Imita el canto de las ballenas jorobadas del Pacífico colombiano reproduciendo la secuencia de notas mágicas.</p>
                    <div class="grid grid-cols-2 gap-4 max-w-sm mx-auto mb-6">
                        <button id="pad-0" onclick="pressPad(0)" class="bg-cyan-400 hover:bg-cyan-300 text-white font-bold h-24 rounded-3xl text-3xl shadow-lg transition transform active:scale-95">🎵 Azul</button>
                        <button id="pad-1" onclick="pressPad(1)" class="bg-coralPink hover:bg-coralPink/80 text-white font-bold h-24 rounded-3xl text-3xl shadow-lg transition transform active:scale-95">🎶 Coral</button>
                        <button id="pad-2" onclick="pressPad(2)" class="bg-sunYellow hover:bg-sunYellow/80 text-deepNavy font-bold h-24 rounded-3xl text-3xl shadow-lg transition transform active:scale-95">🎼 Oro</button>
                        <button id="pad-3" onclick="pressPad(3)" class="bg-seaGreen hover:bg-seaGreen/80 text-white font-bold h-24 rounded-3xl text-3xl shadow-lg transition transform active:scale-95">🌊 Verde</button>
                    </div>
                    <div id="mg2-status" class="text-lg font-bold text-oceanBlue mb-4">Haz clic en 'Comenzar Concierto'</div>
                    <button id="mg2-start-btn" onclick="startMg2()" class="bg-gradient-to-r from-oceanBlue to-oceanTurquoise text-white font-bold px-8 py-3 rounded-xl shadow-lg hover:scale-105 transition">Comenzar Concierto 🎶</button>
                </div>
            `;
        }

        function startMg2() {
            mg2Sequence = [];
            mg2PlayerSeq = [];
            mg2Active = false;
            document.getElementById('mg2-start-btn').classList.add('hidden');
            nextMg2Round();
        }

        function nextMg2Round() {
            mg2PlayerSeq = [];
            mg2Sequence.push(Math.floor(Math.random() * 4));
            document.getElementById('mg2-status').innerText = `🔊 ¡Escucha el canto de la ballena (${mg2Sequence.length} notas)!`;
            playMg2Sequence();
        }

        async function playMg2Sequence() {
            mg2Active = false;
            for(let i=0; i<mg2Sequence.length; i++) {
                await new Promise(res => setTimeout(res, 600));
                highlightPad(mg2Sequence[i]);
                await new Promise(res => setTimeout(res, 400));
            }
            document.getElementById('mg2-status').innerText = "✨ ¡Tu turno! Repite la melodía.";
            mg2Active = true;
        }

        function highlightPad(idx) {
            const pad = document.getElementById(`pad-${idx}`);
            if(!pad) return;
            const orig = pad.className;
            pad.className = "bg-white text-deepNavy font-bold h-24 rounded-3xl text-3xl shadow-2xl scale-105 transition transform border-4 border-deepNavy";
            setTimeout(() => { pad.className = orig; }, 300);
        }

        function pressPad(idx) {
            if(!mg2Active) return;
            highlightPad(idx);
            mg2PlayerSeq.push(idx);

            const currentIndex = mg2PlayerSeq.length - 1;
            if(mg2PlayerSeq[currentIndex] !== mg2Sequence[currentIndex]) {
                document.getElementById('mg2-status').innerText = "❌ ¡Canto incorrecto! Inténtalo de nuevo.";
                mg2Active = false;
                document.getElementById('mg2-start-btn').classList.remove('hidden');
                document.getElementById('mg2-start-btn').innerText = "Reintentar Concierto 🔄";
                return;
            }

            if(mg2PlayerSeq.length === mg2Sequence.length) {
                if(mg2Sequence.length === 4) {
                    mg2Active = false;
                    triggerReward(2, "¡Maestro de las Ballenas del Pacífico!", 100);
                } else {
                    document.getElementById('mg2-status').innerText = "🎉 ¡Muy bien! Preparando siguiente nota...";
                    mg2Active = false;
                    setTimeout(nextMg2Round, 1200);
                }
            }
        }


        // --- MINIGAME 3: Guardianes del Manglar (Clasificación) ---
        let mg3Items = [
            { name: "Pez Sabaleta", type: "pez", emoji: "🐟" },
            { name: "Cangrejo Azul", type: "cangrejo", emoji: "🦀" },
            { name: "Garza Blanca", type: "ave", emoji: "🦢" },
            { name: "Pez Pargo", type: "pez", emoji: "🐠" },
            { name: "Cangrejo Rojo", type: "cangrejo", emoji: "🦀" },
            { name: "Martín Pescador", type: "ave", emoji: "🦅" }
        ];
        let mg3CurrentIndex = 0;
        let mg3ScoreCount = 0;

        function initMiniGame3() {
            mg3CurrentIndex = 0;
            mg3ScoreCount = 0;
            document.getElementById('mg3-title')?.innerText || '';
            document.getElementById('mg-title').innerText = "🌳 Guardianes del Manglar";
            renderMg3Card();
        }

        function renderMg3Card() {
            if(mg3CurrentIndex >= mg3Items.length) {
                triggerReward(3, "¡Guardián Protector del Manglar!", 100);
                return;
            }
            const item = mg3Items[mg3CurrentIndex];
            document.getElementById('mg-content').innerHTML = `
                <div class="text-center">
                    <p class="text-slate-600 mb-4 font-medium">Clasifica correctamente cada especie en su hogar de manglar de la costa colombiana.</p>
                    <div class="bg-emerald-50 border-4 border-emerald-300 rounded-3xl p-8 mb-6 max-w-sm mx-auto shadow-inner">
                        <div class="text-7xl mb-4 animate-bounce">${item.emoji}</div>
                        <h3 class="text-2xl font-bold text-emerald-800">${item.name}</h3>
                        <p class="text-xs text-emerald-600 mt-1">¿A qué grupo pertenece?</p>
                    </div>
                    <div class="grid grid-cols-3 gap-3 max-w-md mx-auto">
                        <button onclick="checkMg3('pez')" class="bg-cyan-500 hover:bg-cyan-400 text-white font-bold p-4 rounded-2xl shadow-md transition transform active:scale-95">🐟 Peces</button>
                        <button onclick="checkMg3('cangrejo')" class="bg-coralOrange hover:bg-coralOrange/80 text-white font-bold p-4 rounded-2xl shadow-md transition transform active:scale-95">🦀 Cangrejos</button>
                        <button onclick="checkMg3('ave')" class="bg-sunYellow hover:bg-sunYellow/80 text-deepNavy font-bold p-4 rounded-2xl shadow-md transition transform active:scale-95">🦅 Aves</button>
                    </div>
                    <p class="text-xs text-slate-500 mt-4">Progreso: ${mg3CurrentIndex + 1} de ${mg3Items.length}</p>
                </div>
            `;
        }

        function checkMg3(type) {
            const item = mg3Items[mg3CurrentIndex];
            if(item.type === type) {
                mg3CurrentIndex++;
                renderMg3Card();
            } else {
                alert("¡Casi! Inténtalo con otra categoría para proteger este manglar.");
            }
        }


        // --- MINIGAME 4: Trivia Marina Colombiana ---
        const triviaQuestions = [
            {
                q: "¿Qué ecosistema costero de Colombia actúa como guardería natural para peces y protege la costa?",
                options: ["Los Manglares", "Los Desiertos", "Las Montañas Nevadas"],
                answer: 0
            },
            {
                q: "¿Cuál de estos animales marinos visita las costas del Pacífico colombiano para tener sus crías?",
                options: ["El Oso de Anteojos", "La Ballena Jorobada", "El Cóndor de los Andes"],
                answer: 1
            },
            {
                q: "¿Qué color tienen los hermosos arrecifes de coral sanos en el Caribe?",
                options: ["Negro ceniza", "Rojo, verde y amarillo brillante", "Blanco plástico"],
                answer: 1
            }
        ];
        let triviaIndex = 0;

        function initMiniGame4() {
            triviaIndex = 0;
            document.getElementById('mg-title').innerText = "❓ Trivia Marina Colombiana";
            renderTriviaQuestion();
        }

        function renderTriviaQuestion() {
            if(triviaIndex >= triviaQuestions.length) {
                triggerReward(4, "¡Experto en Biodiversidad de Colombia!", 100);
                return;
            }
            const q = triviaQuestions[triviaIndex];
            let optionsHtml = q.options.map((opt, i) => `
                <button onclick="answerTrivia(${i})" class="w-full text-left bg-sky-50 hover:bg-sky-100 border-2 border-sky-300 text-slate-800 font-semibold p-4 rounded-2xl shadow-sm transition transform hover:scale-[1.01] mb-3 flex items-center justify-between">
                    <span>${opt}</span>
                    <span class="text-xl">👉</span>
                </button>
            `).join('');

            document.getElementById('mg-content').innerHTML = `
                <div class="max-w-lg mx-auto">
                    <div class="bg-amber-50 border-2 border-amber-300 p-4 rounded-2xl mb-4 text-center">
                        <span class="text-xs font-bold text-amber-700">Pregunta ${triviaIndex + 1} de ${triviaQuestions.length}</span>
                        <h3 class="text-lg font-bold text-slate-800 mt-1">${q.q}</h3>
                    </div>
                    <div class="space-y-2">
                        ${optionsHtml}
                    </div>
                </div>
            `;
        }

        function answerTrivia(idx) {
            const q = triviaQuestions[triviaIndex];
            if(idx === q.answer) {
                triviaIndex++;
                renderTriviaQuestion();
            } else {
                alert("¡Buen intento! Recuerda cuidar y proteger la vida marina de Colombia. ¡Inténtalo de nuevo!");
            }
        }


        // --- MINIGAME 5: Limpieza del Fondo Marino ---
        let trashCount = 6;
        function initMiniGame5() {
            trashCount = 6;
            document.getElementById('mg-title').innerText = "✨ Limpieza del Fondo Marino";
            renderTrashGame();
        }

        function renderTrashGame() {
            if(trashCount <= 0) {
                triggerReward(5, "¡Protector Supremo del Océano!", 100);
                return;
            }

            let trashItemsHtml = '';
            for(let i=0; i<trashCount; i++) {
                // Generate random positions
                const top = 20 + (i * 12) % 60;
                const left = 10 + (i * 15) % 75;
                const symbols = ['🧴', '🥤', '🛍️', '🥫'];
                const sym = symbols[i % symbols.length];
                trashItemsHtml += `
                    <div onclick="removeTrash(${i})" class="absolute text-4xl cursor-pointer hover:scale-125 transition animate-pulse" style="top: ${top}%; left: ${left}%;">
                        ${sym}
                    </div>
                `;
            }

            document.getElementById('mg-content').innerHTML = `
                <div class="text-center">
                    <p class="text-slate-600 mb-4 font-medium">Haz clic en la basura acumulada en el fondo marino para limpiarla y descubrir tesoros naturales.</p>
                    <div class="relative bg-gradient-to-b from-oceanBlue to-deepNavy rounded-3xl h-72 mx-auto max-w-md border-4 border-sunYellow shadow-inner overflow-hidden flex items-center justify-center">
                        <div class="absolute bottom-4 text-center text-white/50 text-sm">Fondo Marino del Caribe • ¡Haz clic en los residuos!</div>
                        ${trashItemsHtml}
                    </div>
                    <p class="mt-4 font-bold text-oceanBlue">Residuos restantes: <span id="trash-counter">${trashCount}</span></p>
                </div>
            `;
        }

        function removeTrash(idx) {
            trashCount--;
            renderTrashGame();
        }


        // --- Rewards & Toast System ---
        function triggerReward(gameId, badgeTitle, points) {
            gameState.score += points;
            gameState.badges[gameId - 1] = true;
            gameState.completedGames[gameId - 1] = true;
            saveGameState();

            document.getElementById('toast-icon').innerText = "🏆";
            document.getElementById('toast-title').innerText = `¡Medalla Desbloqueada!`;
            document.getElementById('toast-msg').innerText = `Has ganado +${points} Puntos y la insignia: "${badgeTitle}". ¡Increíble trabajo, guardián!`;
            document.getElementById('toast-modal').classList.remove('hidden');
            
            // Override toast button to go back to map
            const btn = document.querySelector('#toast-box button');
            btn.onclick = () => {
                closeToast();
                showScreen('map');
            };
        }

        function closeToast() {
            document.getElementById('toast-modal').classList.add('hidden');
        }

        function showBadgesModal() {
            const badgesList = [
                { title: "Biólogo Junior del Caribe", desc: "Completado en Arrecife", icon: "🐢" },
                { title: "Maestro de las Ballenas", desc: "Completado en Pacífico", icon: "🐋" },
                { title: "Guardián del Manglar", desc: "Clasificación de especies", icon: "🌳" },
                { title: "Experto en Biodiversidad", desc: "Trivia de Colombia", icon: "❓" },
                { title: "Protector Supremo del Océano", desc: "Limpieza del fondo marino", icon: "✨" }
            ];

            let html = badgesList.map((b, idx) => `
                <div class="flex items-center space-x-4 p-3 rounded-2xl ${gameState.badges[idx] ? 'bg-emerald-50 border-2 border-emerald-300' : 'bg-slate-50 border-2 border-slate-200 opacity-60'}">
                    <span class="text-4xl">${b.icon}</span>
                    <div class="text-left flex-grow">
                        <h4 class="font-bold text-slate-800">${b.title}</h4>
                        <p class="text-xs text-slate-500">${b.desc}</p>
                    </div>
                    <span class="text-xl">${gameState.badges[idx] ? '✅' : '🔒'}</span>
                </div>
            `).join('');

            document.getElementById('toast-icon').innerText = "🏆";
            document.getElementById('toast-title').innerText = "Tus Medallas de Guardián";
            document.getElementById('toast-msg').innerHTML = `<div class="space-y-3 mt-2 max-h-60 overflow-y-auto pr-1">${html}</div>`;
            const btn = document.querySelector('#toast-box button');
            btn.innerText = "¡Genial! 🌟";
            btn.onclick = closeToast;
            document.getElementById('toast-modal').classList.remove('hidden');
        }


        // --- 5. Studio of Colors & Marine Art (Interactive Coloring) ---
        let selectedColor = '#06b6d4';

        function renderColoringScreen() {
            return `
                <div class="max-w-4xl mx-auto w-full bg-white/95 backdrop-blur-md rounded-3xl p-6 sm:p-8 shadow-2xl border-4 border-sunYellow">
                    <div class="flex flex-wrap justify-between items-center mb-6 pb-4 border-b-2 border-slate-100">
                        <div>
                            <h2 class="text-2xl sm:text-3xl font-bold text-oceanBlue">🎨 Estudio de Colores y Arte Marino</h2>
                            <p class="text-slate-600 text-sm">Selecciona un color vibrante y haz clic en las partes del pez y arrecife para pintarlos.</p>
                        </div>
                        <button onclick="showScreen('home')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold px-4 py-2 rounded-xl text-sm transition mt-2 sm:mt-0">
                            ⬅️ Menú Principal
                        </button>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 items-center">
                        <!-- Color Palette -->
                        <div class="bg-sky-50 p-6 rounded-3xl border-2 border-sky-200 text-center">
                            <h3 class="font-bold text-oceanBlue mb-4">Paleta de Colores</h3>
                            <div class="grid grid-cols-4 gap-3 justify-items-center mb-4">
                                <div onclick="selectColor('#06b6d4')" class="w-12 h-12 rounded-full bg-cyan-400 cursor-pointer shadow-md hover:scale-110 transition border-2 border-white color-btn" style="box-shadow: 0 0 10px #06b6d4"></div>
                                <div onclick="selectColor('#0284c7')" class="w-12 h-12 rounded-full bg-blue-600 cursor-pointer shadow-md hover:scale-110 transition border-2 border-white color-btn"></div>
                                <div onclick="selectColor('#fb7185')" class="w-12 h-12 rounded-full bg-rose-400 cursor-pointer shadow-md hover:scale-110 transition border-2 border-white color-btn"></div>
                                <div onclick="selectColor('#facc15')" class="w-12 h-12 rounded-full bg-yellow-400 cursor-pointer shadow-md hover:scale-110 transition border-2 border-white color-btn"></div>
                                <div onclick="selectColor('#34d399')" class="w-12 h-12 rounded-full bg-emerald-400 cursor-pointer shadow-md hover:scale-110 transition border-2 border-white color-btn"></div>
                                <div onclick="selectColor('#fb923c')" class="w-12 h-12 rounded-full bg-orange-400 cursor-pointer shadow-md hover:scale-110 transition border-2 border-white color-btn"></div>
                                <div onclick="selectColor('#c084fc')" class="w-12 h-12 rounded-full bg-purple-400 cursor-pointer shadow-md hover:scale-110 transition border-2 border-white color-btn"></div>
                                <div onclick="selectColor('#f43f5e')" class="w-12 h-12 rounded-full bg-rose-600 cursor-pointer shadow-md hover:scale-110 transition border-2 border-white color-btn"></div>
                            </div>
                            <p class="text-xs text-slate-500 font-medium">Color seleccionado: <span id="current-color-label" class="font-bold text-cyan-600">Turquesa</span></p>
                            <button onclick="resetColoring()" class="mt-4 bg-white hover:bg-slate-100 text-slate-700 text-xs font-bold px-4 py-2 rounded-xl shadow border border-slate-200">Limpiar Lienzo 🔄</button>
                        </div>

                        <!-- Interactive Coloring SVG Canvas -->
                        <div class="md:col-span-2 bg-gradient-to-b from-sky-100 to-sky-200 p-6 rounded-3xl border-4 border-oceanTurquoise flex flex-col items-center justify-center shadow-inner">
                            <svg viewBox="0 0 500 350" class="w-full max-w-md h-auto drop-shadow-md">
                                <!-- Background Bubbles SVG -->
                                <circle cx="50" cy="50" r="15" fill="rgba(255,255,255,0.6)" />
                                <circle cx="430" cy="80" r="10" fill="rgba(255,255,255,0.6)" />
                                
                                <!-- Coral 1 -->
                                <path onclick="paintPart(this)" d="M50 300 Q50 240 70 200 Q90 240 90 300 Z" fill="#ffffff" stroke="#0f172a" stroke-width="4" class="cursor-pointer hover:opacity-80 transition"/>
                                <path onclick="paintPart(this)" d="M75 300 Q75 220 100 180 Q125 220 125 300 Z" fill="#ffffff" stroke="#0f172a" stroke-width="4" class="cursor-pointer hover:opacity-80 transition"/>

                                <!-- Fish Body Parts -->
                                <ellipse onclick="paintPart(this)" cx="280" cy="180" rx="90" ry="60" fill="#ffffff" stroke="#0f172a" stroke-width="4" class="cursor-pointer hover:opacity-80 transition" />
                                <polygon onclick="paintPart(this)" points="370,180 440,130 440,230" fill="#ffffff" stroke="#0f172a" stroke-width="4" class="cursor-pointer hover:opacity-80 transition" />
                                <polygon onclick="paintPart(this)" points="240,120 280,80 320,120" fill="#ffffff" stroke="#0f172a" stroke-width="4" class="cursor-pointer hover:opacity-80 transition" />
                                <polygon onclick="paintPart(this)" points="240,240 280,280 320,240" fill="#ffffff" stroke="#0f172a" stroke-width="4" class="cursor-pointer hover:opacity-80 transition" />
                                
                                <!-- Fish Eye -->
                                <circle cx="225" cy="165" r="12" fill="#0f172a" />
                                <circle cx="228" cy="162" r="4" fill="#ffffff" />
                            </svg>
                            <p class="text-xs text-slate-600 mt-3 font-semibold">✨ ¡Haz clic en cada sección del pez y los corales para pintarlos con tu color favorito!</p>
                        </div>
                    </div>
                </div>
            `;
        }

        function selectColor(colorHex) {
            selectedColor = colorHex;
            document.getElementById('current-color-label').style.color = colorHex;
            document.getElementById('current-color-label').innerText = colorHex;
        }

        function paintPart(element) {
            element.setAttribute('fill', selectedColor);
        }

        function resetColoring() {
            document.querySelectorAll('svg path, svg ellipse, svg polygon').forEach(el => {
                if(el.tagName !== 'circle') {
                    el.setAttribute('fill', '#ffffff');
                }
            });
        }

        // Initialize App on Load
        window.onload = function() {
            initBubbles();
            showScreen('home');
        };
    </script>
</body>
</html>
